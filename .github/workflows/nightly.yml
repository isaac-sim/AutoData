name: Autodata Nightly

# 03:30 UTC is off-peak and offset from other repos' nightlies to reduce GPU-runner contention.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test_full:
    name: Full E2E (GPU, rebuilt image)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180

    env:
      FORCE_REBUILD: "true"
      PYTEST_MARK: ""
      AUTODATA_RESULTS_DIR: test-results

    steps:
      # Self-hosted runners persist the workspace; clear prior results so an early
      # failure can't upload a stale report.
      - name: Remove stale test results
        run: rm -rf "${AUTODATA_RESULTS_DIR:-test-results}"

      - name: nvidia-smi
        run: nvidia-smi

      - name: Clean up submodules directory
        run: |
          rm -f .git/modules/submodules/IsaacLab-Arena/index.lock || true
          rm -rf submodules/* || true

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$PWD"

      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Pull LFS test data
        run: |
          git lfs install --local
          git lfs pull

      - name: Run full E2E suite
        # The GPU runners are shared. Use an empty job-temporary Docker config so
        # stale credentials cannot override anonymous access to the public base image,
        # and this job cannot modify the runner's persistent Docker login.
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/autodata-docker
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          ./scripts/ci/run_tests.sh

      - name: Test results summary
        if: always()
        run: python3 scripts/ci/summarize_test_results.py "${AUTODATA_RESULTS_DIR:-test-results}/junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  publish_docs:
    name: Publish docs (GitHub Pages)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          pip install --no-cache-dir -r docs/requirements.txt
          make -C docs multi-docs SPHINXOPTS=-W
          touch docs/_build/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
