name: Isaac AutoData Nightly

# 03:30 UTC is off-peak and offset from other repos' nightlies to reduce GPU-runner contention.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test_full:
    name: Full E2E (GPU, rebuilt image)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180

    env:
      FORCE_REBUILD: "true"
      PYTEST_MARK: ""
      ISAAC_AUTODATA_RESULTS_DIR: test-results

    steps:
      # Self-hosted runners persist the workspace; clear prior results so an early
      # failure can't upload a stale report.
      - name: Remove stale test results
        run: rm -rf "${ISAAC_AUTODATA_RESULTS_DIR:-test-results}"

      - name: nvidia-smi
        run: nvidia-smi

      - name: Clean up submodules directory
        run: |
          rm -f .git/modules/submodules/IsaacLab-Arena/index.lock || true
          rm -rf submodules/* || true

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$PWD"

      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Pull LFS test data
        run: |
          git lfs install --local
          git lfs pull

      - name: Run full E2E suite
        run: ./scripts/ci/run_tests.sh

      - name: Test results summary
        if: always()
        run: python3 scripts/ci/summarize_test_results.py "${ISAAC_AUTODATA_RESULTS_DIR:-test-results}/junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  publish_docs:
    name: Publish docs (GitHub Pages)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          pip install --no-cache-dir -r docs/requirements.txt
          make -C docs multi-docs SPHINXOPTS=-W
          touch docs/_build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build
          force_orphan: true
