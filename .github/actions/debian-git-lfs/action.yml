name: Debian git and Git LFS
description: Install git and Git LFS on Debian-based CI container images.

inputs:
  install_make:
    description: Also install make (Sphinx docs builds).
    required: false
    default: "false"
  mark_safe_directory:
    description: Mark the workspace as a safe git directory.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        pkgs=(git git-lfs ca-certificates)
        if [[ "${{ inputs.install_make }}" == "true" ]]; then
          pkgs+=(make)
        fi
        apt-get update
        apt-get install -y --no-install-recommends "${pkgs[@]}"
        git --version
        git lfs version

    - name: Mark repo as safe for git
      if: inputs.mark_safe_directory == 'true'
      shell: bash
      run: git config --global --add safe.directory "$PWD"
