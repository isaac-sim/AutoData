<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" role="img" aria-labelledby="title description">
  <title id="title">From arm paths to a joint schedule</title>
  <desc id="description">Planned transits and demonstration skills keep their path order.
    The right arm waits for pouring and clearance, then picks and places the bowl while
    the left arm returns the beaker. Timing is illustrative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <pattern id="wait" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b6c2d0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1040" height="370" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
    <text x="30" y="38" font-size="21" font-weight="700">Build paths</text>
    <text x="30" y="64" font-size="16">Adapt skills and plan transits</text>
    <path d="M278 42 H324" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="350" y="38" font-size="21" font-weight="700">Schedule</text>
    <text x="350" y="64" font-size="16">Task order + collision constraints</text>
    <path d="M656 42 H702" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="730" y="38" font-size="21" font-weight="700">Replay</text>
    <text x="730" y="64" font-size="16">Restore state and record in simulation</text>
    <path d="M30 84 H1010" stroke="#cbd5e1"/>

    <text x="30" y="139" font-size="17" font-weight="700">Left arm</text>
    <text x="30" y="161" font-size="14">Beaker</text>
    <text x="30" y="249" font-size="17" font-weight="700">Right arm</text>
    <text x="30" y="271" font-size="14">Bowl</text>

    <g stroke="#f8fafc" stroke-width="2">
      <rect x="150" y="119" width="80" height="40" rx="4" fill="#2976bd"/>
      <rect x="230" y="119" width="105" height="40" rx="4" fill="#fdba74"/>
      <rect x="335" y="119" width="65" height="40" rx="4" fill="#2976bd"/>
      <rect x="400" y="119" width="140" height="40" rx="4" fill="#fdba74"/>
      <rect x="540" y="119" width="180" height="40" rx="4" fill="#2976bd"/>
      <rect x="720" y="119" width="105" height="40" rx="4" fill="#fdba74"/>
      <rect x="825" y="119" width="150" height="40" rx="4" fill="url(#wait)"/>

      <rect x="150" y="229" width="390" height="40" rx="4" fill="url(#wait)"/>
      <rect x="540" y="229" width="100" height="40" rx="4" fill="#2976bd"/>
      <rect x="640" y="229" width="100" height="40" rx="4" fill="#fdba74"/>
      <rect x="740" y="229" width="130" height="40" rx="4" fill="#2976bd"/>
      <rect x="870" y="229" width="105" height="40" rx="4" fill="#fdba74"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="190" y="144" fill="white">Transit</text>
      <text x="282" y="144">Grasp</text>
      <text x="367" y="144" fill="white">Transit</text>
      <text x="470" y="144">Pour + clear</text>
      <text x="630" y="144" fill="white">Return to bin</text>
      <text x="772" y="144">Release</text>
      <text x="900" y="144">Final hold</text>
      <text x="345" y="254">Wait before starting</text>
      <text x="590" y="254" fill="white">Transit</text>
      <text x="690" y="254">Grasp</text>
      <text x="805" y="254" fill="white">To scale</text>
      <text x="922" y="254">Place</text>
    </g>
    <path d="M540 162 V224" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="556" y="194" font-size="15">Pour ends before bowl pickup starts</text>
    <path d="M150 291 H987" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="987" y="315" text-anchor="end" font-size="14">Time (illustrative)</text>

    <rect x="150" y="333" width="18" height="15" rx="2" fill="#2976bd"/>
    <text x="176" y="346" font-size="14">Planned transit</text>
    <rect x="325" y="333" width="18" height="15" rx="2" fill="#fdba74"/>
    <text x="351" y="346" font-size="14">Demonstration skill</text>
    <rect x="545" y="333" width="18" height="15" rx="2" fill="url(#wait)"/>
    <text x="571" y="346" font-size="14">Wait / hold</text>
    <text x="1010" y="346" text-anchor="end" font-size="13" fill="#475569">Same paths; chosen start times</text>
  </g>
</svg>
