  <title id="title">Fast camera, old observations</title>
  <desc id="desc">A diagnostic schematic, not a time-scaled plot. Camera capture, FIFO buffering, inference and execution each affect freshness. G1 measurements found nine queued inputs of lag, about 122 milliseconds of ONNX Runtime inference and image ages of 530 to 733 milliseconds at the first action. The 60 FPS capture configuration is shown separately, not as part of that measured run.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="344" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b40">
    <text x="28" y="38" font-size="22" font-weight="700">Fast camera, old observations</text>
    <text x="28" y="65" font-size="15" fill="#526478">Inspect each stage. Raising capture FPS does not clear a downstream backlog.</text>
    <g fill="#ffffff" stroke="#ced8e3"><rect x="28" y="96" width="202" height="146" rx="10"/><rect x="262" y="96" width="202" height="146" rx="10"/><rect x="496" y="96" width="202" height="146" rx="10"/><rect x="730" y="96" width="202" height="146" rx="10"/></g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M235 168H253"/><path d="M469 168H487"/><path d="M703 168H721"/></g>
    <g font-size="17" font-weight="700"><text x="46" y="125">CAPTURE</text><text x="280" y="125">BUFFER</text><text x="514" y="125">INFERENCE</text><text x="748" y="125">FIRST ACTION</text></g>
    <text x="46" y="164" font-size="25" fill="#137c9b">60 FPS</text>
    <text x="46" y="191" font-size="14">Deployment configuration</text>
    <text x="46" y="216" font-size="14">Verify actual delivery rate</text>
    <text x="280" y="164" font-size="25" fill="#a05216">9 inputs behind</text>
    <text x="280" y="191" font-size="14">Observed FIFO backlog</text>
    <text x="280" y="216" font-size="14">Consume the newest input</text>
    <text x="514" y="164" font-size="25">~122 ms</text>
    <text x="514" y="191" font-size="14">Measured ONNX Runtime</text>
    <text x="514" y="216" font-size="14">Budget transport too</text>
    <text x="748" y="164" font-size="25" fill="#a05216">530–733 ms</text>
    <text x="748" y="191" font-size="14">Measured source image age</text>
    <text x="748" y="216" font-size="14">Check at action decoding</text>
    <rect x="28" y="266" width="904" height="51" rx="8" fill="#e7efdf"/>
    <text x="48" y="289" font-size="16">Carry the source timestamp all the way to execution. Check RGB and wrist-state age separately.</text>
    <text x="48" y="308" font-size="13" fill="#526478">Schematic, not to scale. Configuration and recorded measurements are distinct observations.</text>
  </g>
</svg>
