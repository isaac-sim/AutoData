[tool.isort]

py_version = 312
line_length = 120
group_by_package = true

# Files to skip
skip_glob = ["docs/*", "logs/*", "_isaac_sim/*", ".vscode/*"]

# Order of imports
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# Extra standard libraries considered as part of python (permissive licenses)
extra_standard_library = [
    "numpy",
    "h5py",
    "torch",
    "tensordict",
    "matplotlib",
    "gymnasium",
    "scipy",
    "yaml",
    "toml",
    "trimesh",
    "tqdm",
    "torchvision",
    "transformers",
]

# Imports from Isaac Sim and Omniverse
known_third_party = [
    "curobo",
    "isaacsim.core.api",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_rl",
    "isaaclab_mimic",
    "isaaclab_tasks",
    "isaaclab_arena",
]

# Imports from this repository
known_first_party = [
    "autodata_core",
    "autodata_interfaces",
    "autodata_utils",
    "autodata_examples",
]

[tool.pyright]

include = ["autodata_core", "autodata_interfaces", "autodata_utils", "autodata_examples"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"

[tool.codespell]
skip = '*.usd,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build'
quiet-level = 0
ignore-words-list = 'reacher'

[tool.pytest.ini_options]
# Scope default collection to the AutoData test suite (keeps pytest out of submodules).
testpaths = ["autodata_tests"]
markers = [
    "with_subprocess: test launches the data-generation CLI as an Isaac Sim child process",
]
filterwarnings = [
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
]
