# Environment profile: Franka cube stacking inside a blue sorting bin, on the neutral IK-Rel task.
#
# Overlays the scene and reset-event deltas of the upstream bin-stack env config
# (bin_stack_joint_pos_env_cfg.py) so no specialized env id is needed. Spawn poses of pinned
# assets match their reset events: the planner's collision world reads spawn poses from the
# USD stage, not physics resets.

name: franka_bin_stack
description: Blue sorting bin fixed at table center with the blue cube inside; red and green cubes spawn outside the bin.
base_env: Isaac-Stack-Cube-Franka-IK-Rel-v0
planner: franka_stack_cube_bin

scene:
  rigid_objects:
    add:
      blue_sorting_bin:
        prim_path: "{ENV_REGEX_NS}/BlueSortingBin"
        usd_path: "{ISAACLAB_NUCLEUS_DIR}/Mimic/nut_pour_task/nut_pour_assets/sorting_bin_blue.usd"
        position: [0.4, 0.0, 0.0203]
        rotation: [0.0, 0.0, 0.0, 1.0]  # identity (x, y, z, w)
        scale: [1.1, 1.6, 3.3]
    # Stiffer contact solving for cubes settling against the bin walls (base task uses 16).
    override:
      cube_1: {rigid_props: {solver_position_iteration_count: 40}}
      cube_2: {rigid_props: {solver_position_iteration_count: 40}}
      cube_3: {rigid_props: {solver_position_iteration_count: 40}}

events:
  remove: [randomize_cube_positions]
  add:
    # Bin and cube_1 (the stack base) are pinned at the table center; cube_2/cube_3 randomize
    # outside the bin.
    reset_blue_bin_pose:
      func: "isaaclab_tasks.manager_based.manipulation.stack.mdp.franka_stack_events:randomize_object_pose"
      mode: reset
      params:
        pose_range: {x: [0.4, 0.4], y: [0.0, 0.0], z: [0.0203, 0.0203], yaw: [0.0, 0.0]}
        min_separation: 0.0
        asset_cfgs: [blue_sorting_bin]
    reset_cube_1_pose:
      func: "isaaclab_tasks.manager_based.manipulation.stack.mdp.franka_stack_events:randomize_object_pose"
      mode: reset
      params:
        pose_range: {x: [0.4, 0.4], y: [0.0, 0.0], z: [0.0203, 0.0203], yaw: [0.0, 0.0]}
        min_separation: 0.0
        asset_cfgs: [cube_1]
    reset_cube_pose:
      func: "isaaclab_tasks.manager_based.manipulation.stack.mdp.franka_stack_events:randomize_object_pose"
      mode: reset
      params:
        pose_range: {x: [0.65, 0.70], y: [-0.18, 0.18], z: [0.0203, 0.0203], yaw: [-1.0, 1.0]}
        min_separation: 0.1
        asset_cfgs: [cube_2, cube_3]
