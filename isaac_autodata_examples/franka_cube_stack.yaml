# Task descriptor for the Isaac Lab Mimic Franka Cube Stack task.
#
# Mirrors:
#   submodules/IsaacLab-Arena/submodules/IsaacLab/source/isaaclab_mimic/
#   isaaclab_mimic/envs/franka_stack_ik_rel_mimic_env_cfg.py
#
# Notes on what does NOT round-trip from MimicEnvCfg:
#   - `datagen_config` (name, generation_num_trials, seed, max_num_failures,
#     generation_select_src_per_subtask, etc.) is pipeline-level config that
#     lives outside TaskDescriptor.
#   - `next_subtask_description` from the original config is not modeled by
#     the current Subtask dataclass; the prompts have been folded into the
#     subtask's own `description` field where useful.

name: demo_src_stack_isaac_lab_task_D0
description: Stack red, green, and blue cubes into a single tower.
algo: dexmimicgen

subtasks:
  franka:
    - object_ref: cube_2
      description: Grasp red cube.
      subtask_term_signal: grasp_1
      algo_params:
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        subtask_term_offset_range: [10, 20]
        action_noise: 0.03
        num_interpolation_steps: 5
        num_fixed_steps: 0
        apply_noise_during_interpolation: false

    - object_ref: cube_1
      description: Stack red cube on top of blue cube.
      subtask_term_signal: stack_1
      algo_params:
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        subtask_term_offset_range: [10, 20]
        action_noise: 0.03
        num_interpolation_steps: 5
        num_fixed_steps: 0
        apply_noise_during_interpolation: false

    - object_ref: cube_3
      description: Grasp green cube.
      subtask_term_signal: grasp_2
      algo_params:
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        subtask_term_offset_range: [10, 20]
        action_noise: 0.03
        num_interpolation_steps: 5
        num_fixed_steps: 0
        apply_noise_during_interpolation: false

    # Final subtask: no term signal (end-of-trajectory) and no term offset.
    - object_ref: cube_2
      description: Stack green cube on top of red cube.
      algo_params:
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        subtask_term_offset_range: [0, 0]
        action_noise: 0.03
        num_interpolation_steps: 5
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
