# Task descriptor for the Isaac Lab Mimic Franka *bin* Cube Stack task — SkillGen variant.
#
# This is the "adaptive cube stacking in a bin" task from the upstream SkillGen tutorial
# (docs/.../imitation-learning/skillgen.rst, "Task 2"). A tall blue sorting bin is placed at a
# fixed pose in the workspace with the base (blue) cube inside it; the robot stacks the red and
# green cubes onto the blue cube *without colliding with the bin*. It runs on the Mimic env id
# `Isaac-Stack-Cube-Bin-Franka-IK-Rel-Mimic-v0` with SkillGen enabled.
#
# Subtask structure is identical to the plain cube-stack SkillGen variant
# (franka_cube_stack_skillgen.yaml) — grasp cube_2 -> stack on cube_1 -> grasp cube_3 ->
# stack on cube_2 — only the scene differs (the bin obstacle). The motion planner avoids the
# bin during transits; the recorded skill segments are reused.
#
# Source dataset (reused from cube stacking — the SkillGen tutorial documents that the same
# annotated dataset drives both basic and bin cube stacking):
#   datasets/annotated_dataset_skillgen.hdf5

name: demo_src_bin_stack_isaac_lab_task_D0
description: Stack red and green cubes onto the blue cube inside a bin, avoiding the bin (SkillGen).
algo: skillgen

generation_policy:
  select_src_per_subtask: true
  select_src_per_arm: false
  transform_first_robot_pose: false
  interpolate_from_last_target_pose: true

subtasks:
  franka:
    - object_ref: cube_2
      description: Grasp red cube.
      subtask_term_signal: grasp_1
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false

    - object_ref: cube_1
      description: Stack red cube on top of blue cube (inside the bin).
      subtask_term_signal: stack_1
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false

    - object_ref: cube_3
      description: Grasp green cube.
      subtask_term_signal: grasp_2
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false

    # Final subtask: SkillGen needs a term signal here so the planner knows when the last
    # skill segment finishes.
    - object_ref: cube_2
      description: Stack green cube on top of red cube (inside the bin).
      subtask_term_signal: stack_2
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
