# Embodiment descriptor for the Franka (IK, Relative-pose).
#
# Action vector layout (7-D):
#   [0..3)   delta position
#   [3..6)   delta rotation (compact axis-angle, axis * angle in radians)
#   [6..7)   gripper actuation
#
# The pose part is the delta from the current EEF pose to the target.

type: delta_pose_ik_single_arm
name: franka_panda
description: Franka 7-DOF arm with parallel gripper, delta-pose IK control.

eef_name: franka

pose_obs_keys:
  pos: eef_pos
  quat: eef_quat

action_layout:
  gripper_dim: 1
  clip_pose_action_to_unit: true

# Translation [m] from the robot's kinematic control link to the EEF frame the adapter should
# report, i.e. (env-reported EEF frame) - (source-dataset annotation frame). The base IK-Rel
# tasks report the inter-fingertip "end_effector" frame and the MimicGen dataset is annotated in
# that same frame, so no shift is needed. SkillGen's cube-stack dataset is annotated in the
# panda_hand frame, so it needs [0, 0, 0.1034] — use franka_cube_stack_embodiment_skillgen.yaml.
eef_offset: [0.0, 0.0, 0.0]
