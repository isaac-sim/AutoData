name: franka_rope
description: Grasp and manipulate a deformable rope until its ends meet.
algo: softmimicgen

generation_policy:
  name: franka_rope
  seed: 1
  num_trials: 10
  guarantee_success: true
  keep_failed: true
  source_dataset_path: null
  generation_path: null
  task_name: null
  use_skillgen: false
  use_navigation_controller: false
  select_src_per_subtask: false
  select_src_per_arm: false
  transform_first_robot_pose: false
  interpolate_from_last_target_pose: true

subtasks:
  robot0:
    - object_ref: object
      description: Approach and grasp the deformable rope.
      subtask_term_signal: grasp
      selection_strategy: registration_cost
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [10, 15]
      action_noise: 0.0
      num_interpolation_steps: 10
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
      algo_params:
        object_soft: true
        use_rotation_transform: true
        bend_coef: 0.1
        rot_coef: 0.001

    # Final subtask: no term signal (end-of-trajectory) and no term offset.
    - object_ref: object
      description: Manipulate the rope until its ends meet.
      selection_strategy: registration_cost
      selection_strategy_kwargs:
        nn_k: 3
      subtask_term_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 5
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
      algo_params:
        object_soft: true
        use_rotation_transform: true
        bend_coef: 0.1
        rot_coef: 0.001
