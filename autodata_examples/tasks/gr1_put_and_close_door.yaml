name: gr1_put_and_close_door
description: Place the ranch bottle inside the refrigerator and close its door.
algo: dexmimicgen
generation_policy:
  name: gr1_put_and_close_door
  num_trials: 100
  guarantee_success: false
  select_src_per_subtask: true
subtasks:
  right:
    - &grasp
      object_ref: ranch_dressing_hope_robolab
      description: Grasp the bottle.
      subtask_term_signal: subtask_0_right_grasp_1
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs: {nn_k: 3}
      action_noise: 0.003
      num_interpolation_steps: 5
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
    - <<: *grasp
      object_ref: refrigerator
      description: Place the bottle on the refrigerator shelf.
      subtask_term_signal: subtask_0_right_last_mimic_subtask
    - <<: *grasp
      object_ref: refrigerator
      description: Reach the refrigerator door.
      subtask_term_signal: subtask_1_right_move_to_door
    - <<: *grasp
      object_ref: refrigerator
      description: Close the door.
      subtask_term_signal: null
  left:
    - <<: *grasp
      description: Support the bottle placement.
      subtask_term_signal: subtask_0_left_last_mimic_subtask
      num_interpolation_steps: 0
    - <<: *grasp
      object_ref: refrigerator
      description: Hold the supporting arm steady while the door closes.
      subtask_term_signal: null
      num_interpolation_steps: 0
