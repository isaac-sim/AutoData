name: g1_locomanip
description: Navigate to the box, grasp with both hands, carry it to the bin, and release it.
algo: dexmimicgen
generation_policy:
  name: g1_locomanip
  num_trials: 100
  guarantee_success: false
  use_navigation_controller: true
subtasks:
  right:
    - &manipulation
      object_ref: brown_box
      subtask_term_signal: idle_right
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs: {nn_k: 3}
      action_noise: 0.003
      num_interpolation_steps: 0
      num_fixed_steps: 0
      subtask_term_offset_range: [0, 0]
    - <<: *manipulation
      subtask_term_signal: grasp_and_idle_right
    - <<: *manipulation
      subtask_term_signal: null
  left:
    - <<: *manipulation
      subtask_term_signal: idle_left
    - <<: *manipulation
      subtask_term_signal: grasp_and_idle_left
    - <<: *manipulation
      subtask_term_signal: null
  body:
    - &navigation
      <<: *manipulation
      subtask_term_signal: navigate_to_table
      action_noise: 0.0
    - <<: *navigation
      subtask_term_signal: navigate_turn_inplace
    - <<: *navigation
      subtask_term_signal: navigate_to_bin
    - <<: *navigation
      subtask_term_signal: null
