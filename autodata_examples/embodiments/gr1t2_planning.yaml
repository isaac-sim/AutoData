      - [R_middle_intermediate_link, R_thumb_proximal_base_link]
      - [R_middle_intermediate_link, R_thumb_proximal_link]
      - [R_middle_proximal_link, R_pinky_intermediate_link]
      - [R_middle_proximal_link, R_ring_intermediate_link]
      - [R_middle_proximal_link, R_thumb_distal_link]
      - [R_middle_proximal_link, R_thumb_proximal_link]
      - [R_pinky_intermediate_link, R_ring_intermediate_link]
      - [R_pinky_intermediate_link, R_ring_proximal_link]
      - [R_pinky_intermediate_link, R_thumb_distal_link]
      - [R_pinky_intermediate_link, R_thumb_proximal_base_link]
      - [R_pinky_intermediate_link, R_thumb_proximal_link]
      - [R_pinky_proximal_link, R_ring_intermediate_link]
      - [R_pinky_proximal_link, R_thumb_distal_link]
      - [R_pinky_proximal_link, R_thumb_proximal_link]
      - [R_ring_intermediate_link, R_thumb_distal_link]
      - [R_ring_intermediate_link, R_thumb_proximal_base_link]
      - [R_ring_intermediate_link, R_thumb_proximal_link]
      - [R_ring_proximal_link, R_thumb_distal_link]
      - [R_ring_proximal_link, R_thumb_proximal_link]
      - [R_thumb_distal_link, right_hand_pitch_link]
      - [R_thumb_proximal_base_link, right_hand_yaw_link]
      - [R_thumb_proximal_link, right_hand_yaw_link]

sphere_fit:
  # This is a ceiling, not a target: fitting stops as soon as the quality gate passes. Large fixed
  # body meshes need more candidates than the small arm/hand links.
  max_spheres_per_link: 200
  surface_samples_per_geometry: 1000
  candidates_per_geometry: 800
  # Inflate fitted spheres by 5.2 mm; fitting also enforces coverage and native sphere capacity.
  inflation_m: 0.0052
  min_coverage_ratio: 0.95
  max_uncovered_distance_m: 0.01
  convexify_non_watertight: true

robot_config:
  attachment_sphere_count: 100
  self_collision_ignore_depth: 2
  max_acceleration: 15.0
  max_jerk: 500.0

planner:
  world_config_file: collision_table.yml
  static_objects: [table, bin]
  # Match the reviewed GR1T2 SkillGen collision world. Its per-arm transit planner omits the
  # task table; the loose nut starts inside its beaker and is not an independent transit obstacle.
  world_ignore_substrings:
    - /Table
    - /FactoryNut
    - /Robot
    - /World/GroundPlane
    - /World/defaultGroundPlane
    - /curobo
  num_trajopt_seeds: 12
  num_graph_seeds: 12
  interpolation_dt: 0.05
  # The base task leaves arm actuator speeds unbounded; cap planning explicitly.
  max_joint_velocity: 1.0
  collision_cache_size: {obb: 150, mesh: 150}
  trajopt_tsteps: 32
  collision_activation_distance: 0.04
  approach_distance: 0.0
  # Release segments author their own distance; this frame maps the standard -Z direction to
  # world-up while leaving ordinary transits unchanged.
  retreat_distance: 0.0
  approach_retreat_frame: world
  approach_direction: [0.0, 0.0, -1.0]
  enable_graph: true
  enable_graph_attempt: 5
  max_planning_attempts: 15
  enable_finetune_trajopt: true
  # Keep optimized timing; the returned trajectory is sampled at the 20 Hz control rate.
  time_dilation_factor: 1.0
  surface_sphere_radius: 0.01
  position_threshold: 0.005
  rotation_threshold: 0.05
  ik_candidate_count: 32
  debug_planner: true
