schema: isaac-autodata.curobo-planning-groups.v1
name: gr1t2
root_link: base_link
root_pose_source_frame: base_link
full_state_collision_scope: complete

# Pink targets each hand-pitch frame with seven arm joints. Each hand has six independent joints
# and five mimic followers. Keep the waist fixed and retain the followers in the collision model.
inactive_joint_names:
  - waist_yaw_joint
  - waist_pitch_joint
  - waist_roll_joint

planning_groups:
  left_arm:
    eef_name: left
    tool_link: left_hand_pitch_link
    auxiliary_joint_names:
      - L_index_proximal_joint
      - L_middle_proximal_joint
      - L_pinky_proximal_joint
      - L_ring_proximal_joint
      - L_thumb_proximal_yaw_joint
      - L_thumb_proximal_pitch_joint
    initial_auxiliary_joint_positions: 0.0
    # Intended hand contacts supplement the generated topology policy. Other pairs remain checked.
    self_collision_ignore_pairs:
      - [L_index_intermediate_link, L_middle_intermediate_link]
      - [L_index_intermediate_link, L_middle_proximal_link]
      - [L_index_intermediate_link, L_pinky_intermediate_link]
      - [L_index_intermediate_link, L_pinky_proximal_link]
      - [L_index_intermediate_link, L_ring_intermediate_link]
      - [L_index_intermediate_link, L_ring_proximal_link]
      - [L_index_intermediate_link, L_thumb_distal_link]
      - [L_index_intermediate_link, L_thumb_proximal_base_link]
      - [L_index_intermediate_link, L_thumb_proximal_link]
      - [L_index_proximal_link, L_middle_intermediate_link]
      - [L_index_proximal_link, L_pinky_intermediate_link]
      - [L_index_proximal_link, L_ring_intermediate_link]
      - [L_index_proximal_link, L_thumb_distal_link]
      - [L_index_proximal_link, L_thumb_proximal_link]
      - [L_middle_intermediate_link, L_pinky_intermediate_link]
      - [L_middle_intermediate_link, L_pinky_proximal_link]
      - [L_middle_intermediate_link, L_ring_intermediate_link]
      - [L_middle_intermediate_link, L_ring_proximal_link]
      - [L_middle_intermediate_link, L_thumb_distal_link]
      - [L_middle_intermediate_link, L_thumb_proximal_base_link]
      - [L_middle_intermediate_link, L_thumb_proximal_link]
      - [L_middle_proximal_link, L_pinky_intermediate_link]
      - [L_middle_proximal_link, L_ring_intermediate_link]
      - [L_middle_proximal_link, L_thumb_distal_link]
      - [L_middle_proximal_link, L_thumb_proximal_link]
      - [L_pinky_intermediate_link, L_ring_intermediate_link]
      - [L_pinky_intermediate_link, L_ring_proximal_link]
      - [L_pinky_intermediate_link, L_thumb_distal_link]
      - [L_pinky_intermediate_link, L_thumb_proximal_base_link]
      - [L_pinky_intermediate_link, L_thumb_proximal_link]
      - [L_pinky_proximal_link, L_ring_intermediate_link]
      - [L_pinky_proximal_link, L_thumb_distal_link]
      - [L_pinky_proximal_link, L_thumb_proximal_link]
      - [L_ring_intermediate_link, L_thumb_distal_link]
      - [L_ring_intermediate_link, L_thumb_proximal_base_link]
      - [L_ring_intermediate_link, L_thumb_proximal_link]
      - [L_ring_proximal_link, L_thumb_distal_link]
      - [L_ring_proximal_link, L_thumb_proximal_link]
      - [L_thumb_distal_link, left_hand_pitch_link]
      - [L_thumb_proximal_base_link, left_hand_yaw_link]
