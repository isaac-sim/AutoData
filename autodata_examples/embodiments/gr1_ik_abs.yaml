# Embodiment descriptor for the GR1 (IK, Absolute-pose).
#
# Action vector layout (36-D):
#   [0..3)    left EEF position [m]
#   [3..7)    left EEF quaternion (x, y, z, w)
#   [7..10)   right EEF position [m]
#   [10..14)  right EEF quaternion (x, y, z, w)
#   [14..25)  left hand joint positions (11 DOF)
#   [25..36)  right hand joint positions (11 DOF)
#
# Pose is absolute; tracked by the whole-body PinkIK controller.
# EEF poses are read from the `left_hand_roll_link` / `right_hand_roll_link` frames.

type: absolute_pose_whole_body_bimanual
name: gr1t2
description: GR1 humanoid with whole-body IK and dexterous hands, absolute-pose control.

eefs:
  left:
    pose_obs_keys:
      pos: left_eef_pos
      quat: left_eef_quat
    # 11 left-hand joints: 5 proximal + 5 intermediate + 1 distal
    gripper_action_indices: [0, 1, 2, 3, 4, 10, 11, 12, 13, 14, 20]

  right:
    pose_obs_keys:
      pos: right_eef_pos
      quat: right_eef_quat
    # 11 right-hand joints: 5 proximal + 5 intermediate + 1 distal
    gripper_action_indices: [5, 6, 7, 8, 9, 15, 16, 17, 18, 19, 21]

action_layout:
  left_pose_slice: [0, 7]
  right_pose_slice: [7, 14]
  hand_joints_slice: [14, 36]
  canonicalize_quat: true
