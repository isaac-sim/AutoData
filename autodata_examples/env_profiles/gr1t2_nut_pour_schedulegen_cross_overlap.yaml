extends: gr1t2_nut_pour_schedulegen.yaml
name: gr1t2_nut_pour_schedulegen_cross_overlap
description: GR1T2 ScheduleGen stress profile with fixed-waist cross-reach pickups for both arms.
scene:
  rigid_objects:
    override:
      # Move both pickups across the centerline while preserving fixed-waist reachability.
      sorting_beaker:
        position: [0.04, 0.27, 0.9860]
      factory_nut:
        position: [0.04, 0.27, 0.9995]
      sorting_bowl:
        position: [-0.04539, 0.43, 0.9861]
      sorting_scale:
        position: [0.22236, 0.56, 0.9859]
control:
  pink_ik:
    # Track cross-body targets closely during grasp and pour replay.
    frame_tasks:
      left_hand_pitch_link:
        gain: 0.5
      right_hand_pitch_link:
        gain: 0.5
